spring:
  application:
    name: community-clinic
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:clinic}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-stacktrace: never
    include-message: never

clinic:
  timezone: ${CLINIC_TIMEZONE:America/New_York}
  cancellation-cutoff-hours: 2     # patients cannot cancel inside this window
  booking-horizon-days: 30         # how far ahead slots are offered
  show-queue-position: true
  walk-in-priority-minutes: 0      # >0 lets walk-ins jump ahead of scheduled visits by that many minutes
  seed-demo: ${CLINIC_SEED_DEMO:true}
