services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic}
    ports:
      - "5432:5432"
    volumes:
      - clinic-data:/var/lib/postgresql/data
volumes:
  clinic-data:
